[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
  'opinimarl',
]

[project]
name = "OpiniMARL"
version = "0.1"
description = "A JAX framework for studying opinion dynamics with MARL."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "MIT" }
authors = [{ name = "Lukas Seier", email = "lukas.seier12@gmail.com" }]
maintainers = [{ name = "Lukas Seier", email = "lukas.seier12@gmail.com" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy==1.26.4",
  "scipy==1.12.0",
  "jax==0.6.0",
  "jaxlib==0.6.0",
  "chex==0.1.89",
  "flax==0.10.4",
  "optax==0.2.4",
  "orbax-checkpoint==0.11.10",
  "distrax==0.1.5",
  "jaxopt==0.8.3",
  "tensorflow-probability==0.25.0",
  "ml-collections==1.0.0",
  "brax==0.10.3",
  "gym==0.26.2",
  "gymnasium==1.1.1",
  "gymnax==0.0.8",
  "jaxmarl==0.0.7",
  "mujoco==3.1.3",
  "mujoco-mjx==3.1.3",
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "wandb==0.19.8",
  "tensorboardX==2.6.2.2",
  "pandas==2.2.3",
  "matplotlib==3.10.1",
  "seaborn==0.13.2",
  "scikit-learn==1.7.0",
  "networkx==3.4.2",
  "tqdm==4.67.1",
  "rich==13.9.4",
  "glfw==2.8.0",
  "PyOpenGL==3.1.9",
  "trimesh==4.6.5",
  "pillow==11.1.0",
]

[project.optional-dependencies]
dev = [
  "black",
  "pytest==8.3.5",
  "coverage",
]

notebook = [
  "ipykernel==6.29.5",
  "ipython==8.34.0",
  "jupyter==1.1.1",
  "jupyterlab==4.3.6",
  "notebook==7.3.3",
  "ipywidgets==8.1.5",
]

test = [
  "pytest==8.3.5",
  "coverage",
]
